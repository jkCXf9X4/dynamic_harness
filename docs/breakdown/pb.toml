# product-breakdown — this repo's overrides of the standard defaults.
# Standard: 3rd_party/agent_methods_and_tools/methods/product-breakdown/
# The tool is at .agents/skills/product-breakdown/scripts/pb (installed skill).

[nodes]
# The hand-written traceability map stays canonical (claim/need -> decision ->
# artifact V-model coverage that the generated registers do not replace) and is
# therefore exempt from node/leaf checks. The retired decision-log.md lives
# under deprecated/ (skipped by all checks) and is not exempted here.
exempt = ["traceability-map.md"]

[ids]
# IMP candidates keep their Evolution handles (IMP-NNN) as stable ids.
prefixes = { info = "INFO", decision = "DEC", eval = "EVAL", imp = "IMP" }
# Leaf/status vocabulary incl. the repo's investigation-doc statuses and the
# IMP lifecycle end-state (implemented IMPs keep their file under implemented/).
leaf_statuses = ["current", "draft", "superseded", "proposed", "accepted", "open", "implemented"]
# IMP-007…IMP-015 are Proposed in 06-evolution/selected/README.md but not yet
# filed (6 of them are cited from roadmap/watchdog); reserve the handles so
# those forward references resolve. They register with no path.
reserved_ids = ["IMP-007", "IMP-008", "IMP-009", "IMP-010", "IMP-011", "IMP-012", "IMP-013", "IMP-014", "IMP-015"]

[records]
# The 9 legacy ADRs (migrated 2026-09-29) are fact-dense records that predate
# the standard's tighter targets; budget caps are widened to their actual sizes
# so history is preserved intact while the section budgets still enforce.
budgets = { Context = [6, 12], Decision = [6, 20], Rationale = [5, 8] }

[registers]
# The stream index (decisions/README.md) and the Decision Log
# (design-choice-log.md) are generated. Every DL-1…DL-17 decision now has a
# record or state home, so the hand-written decision-log.md was retired to
# deprecated/ (2026-10-02) and replaced by the generated log. The traceability
# map stays hand-written (traceability-map.md): it covers claims/needs, not
# just records.
log = "design-choice-log.md"
traceability = ""